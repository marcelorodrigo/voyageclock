packages:
  - .

allowBuilds:
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  # vue-router@5.5.0 was published on 2026-11-10, inside pnpm's 24h
  # minimumReleaseAge window. Remove this entry once it is older than 24h.
  - 'vue-router@5.5.0'
permissions:
  '@nuxtjs/seo':
    skills: false
